name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log; then
            # Surface compiler errors as annotations (visible in the run summary and via the API)
            grep -E '^e: |What went wrong|^> ' build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk IdleMaster.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IdleMaster-apk
          path: IdleMaster.apk

      # Latest build from main is always available at Releases → "latest"
      - name: Publish to Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest IdleMaster.apk \
            --title "Idle Master for Android (build ${{ github.run_number }})" \
            --notes "Автосборка из ${{ github.sha }}" \
            --target ${{ github.sha }}
