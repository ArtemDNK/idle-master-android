name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log; then
            # Surface compiler errors as annotations (visible in the run summary and via the API)
            # (GitHub keeps at most 10 annotations per step, so pack several lines into each)
            { grep -E '^e: ' build.log; grep -A6 'What went wrong' build.log; } | head -60 | paste -sd'\v' | \
              fold -w 3500 | head -10 | while IFS= read -r chunk; do echo "::error::${chunk//$'\v'/%0A}"; done
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk IdleMaster.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IdleMaster-apk
          path: IdleMaster.apk

      # Latest build from main is always available at Releases → "latest"
      - name: Publish to Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest IdleMaster.apk \
            --title "Idle Master for Android (build ${{ github.run_number }})" \
            --notes "Автосборка из ${{ github.sha }}" \
            --target ${{ github.sha }}

      # Keep only the current build: delete artifacts and runs of all earlier builds
      - name: Clean up old builds
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api --paginate "repos/$REPO/actions/artifacts" --jq ".artifacts[] | select(.workflow_run.id != $RUN_ID) | .id" |
            while read -r id; do gh api -X DELETE "repos/$REPO/actions/artifacts/$id" && echo "deleted artifact $id"; done
          gh api --paginate "repos/$REPO/actions/runs" --jq ".workflow_runs[] | select(.id != $RUN_ID and .status == \"completed\") | .id" |
            while read -r id; do gh api -X DELETE "repos/$REPO/actions/runs/$id" && echo "deleted run $id"; done
